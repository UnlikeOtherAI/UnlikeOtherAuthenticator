name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/${{ vars.GCP_CLOUD_RUN_SERVICE }}:${{ github.sha }}
      STRIPE_BILLING_ENABLED: ${{ vars.STRIPE_BILLING_ENABLED || 'false' }}
      UOA_STRIPE_BILLING_CONFIGURED: ${{ vars.UOA_STRIPE_BILLING_CONFIGURED || 'false' }}
      UOA_SMS_CONFIGURED: ${{ vars.UOA_SMS_CONFIGURED || 'false' }}
      UOA_DIRECTORY_WEBHOOKS_CONFIGURED: ${{ vars.UOA_DIRECTORY_WEBHOOKS_CONFIGURED || 'false' }}
      UOA_ENTERPRISE_SSO_CONFIGURED: ${{ vars.UOA_ENTERPRISE_SSO_CONFIGURED || 'false' }}
      ENTERPRISE_SSO_KMS_KEY: ${{ vars.ENTERPRISE_SSO_KMS_KEY }}
      BILLING_SMS_ENABLED: ${{ vars.BILLING_SMS_ENABLED || 'false' }}
      BILLING_SMS_TWILIO_REGION: ${{ vars.BILLING_SMS_TWILIO_REGION || 'us1' }}
      UOA_SMS_PRICING_MODE: ${{ vars.UOA_SMS_PRICING_MODE || 'legacy' }}
      BILLING_SMS_POLICY_AUTORENEW_ENABLED: ${{ vars.BILLING_SMS_POLICY_AUTORENEW_ENABLED || 'false' }}
      BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS: ${{ vars.BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS || '500' }}
      BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS: ${{ vars.BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS || '7' }}
      BILLING_CREDIT_FX_RATE_SOURCE: ${{ vars.BILLING_CREDIT_FX_RATE_SOURCE || 'stripe' }}
      LEDGER_BILLING_BASE_URL: ${{ vars.LEDGER_BILLING_BASE_URL || 'https://ledger.unlikeotherai.com' }}
      LEDGER_BILLING_APP_KEY_ID: ${{ vars.LEDGER_BILLING_APP_KEY_ID }}
      LEDGER_BILLING_ASSERTION_AUDIENCE: ${{ vars.LEDGER_BILLING_ASSERTION_AUDIENCE || 'https://ledger.unlikeotherai.com' }}
      STRIPE_USAGE_EXPORT_INTERVAL_MINUTES: ${{ vars.STRIPE_USAGE_EXPORT_INTERVAL_MINUTES || '60' }}
      STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES: ${{ vars.STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES || '1' }}
      STRIPE_PRE_BOUNDARY_SAFETY_LEAD_MINUTES: ${{ vars.STRIPE_PRE_BOUNDARY_SAFETY_LEAD_MINUTES || '360' }}
      STRIPE_PRE_BOUNDARY_SAFETY_OFFSET_MINUTES: ${{ vars.STRIPE_PRE_BOUNDARY_SAFETY_OFFSET_MINUTES || '1' }}
      BILLING_INVOICE_STORAGE_PROVIDER: ${{ vars.BILLING_INVOICE_STORAGE_PROVIDER || 'disabled' }}
      BILLING_INVOICE_GCS_BUCKET: ${{ vars.BILLING_INVOICE_GCS_BUCKET }}
      BILLING_INVOICE_GCS_PROJECT_ID: ${{ vars.BILLING_INVOICE_GCS_PROJECT_ID }}
      KELPIE_CONNECT_RESOURCE: ${{ vars.KELPIE_CONNECT_RESOURCE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # A BuildKit builder, so the layers can be cached between deploys: the
      # default docker driver cannot export a cache, and every deploy rebuilt
      # the apt and pnpm install layers from scratch.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=uoa-auth
          cache-to: type=gha,mode=max,scope=uoa-auth
          # A plain single-platform manifest, as the docker driver produced.
          # The BuildKit builder would otherwise push an index with a
          # provenance attestation beside the image.
          provenance: false

      - name: Generate SBOM (CycloneDX)
        run: pnpm dlx @cyclonedx/cyclonedx-npm@2 --output-format json --output-file sbom.json --omit dev
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('sbom.json') != ''
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

      - name: Validate billing deployment configuration
        run: |
          case "$STRIPE_BILLING_ENABLED" in
            true|false) ;;
            *)
              echo "STRIPE_BILLING_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac
          case "$UOA_STRIPE_BILLING_CONFIGURED" in
            true|false) ;;
            *)
              echo "UOA_STRIPE_BILLING_CONFIGURED must be exactly true or false"
              exit 1
              ;;
          esac

          for name in UOA_SMS_CONFIGURED BILLING_SMS_ENABLED BILLING_SMS_POLICY_AUTORENEW_ENABLED; do
            case "${!name}" in
              true|false) ;;
              *) echo "$name must be exactly true or false"; exit 1 ;;
            esac
          done
          if ! [[ "$BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS" =~ ^[0-9]+$ ]] \
            || (( BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS < 1 || BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS > 2000 )); then
            echo "BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS must be an integer from 1 to 2000"
            exit 1
          fi
          if ! [[ "$BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS" =~ ^[0-9]+$ ]] \
            || (( BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS < 1 || BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS > 20 )); then
            echo "BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS must be an integer from 1 to 20"
            exit 1
          fi
          case "$BILLING_SMS_TWILIO_REGION" in
            us1|ie1) ;;
            *) echo "BILLING_SMS_TWILIO_REGION must be us1 or ie1"; exit 1 ;;
          esac
          case "$BILLING_CREDIT_FX_RATE_SOURCE" in
            stripe|ecb) ;;
            *) echo "BILLING_CREDIT_FX_RATE_SOURCE must be stripe or ecb"; exit 1 ;;
          esac
          case "$UOA_SMS_PRICING_MODE" in
            legacy|provider_markup) ;;
            *) echo "UOA_SMS_PRICING_MODE must be legacy or provider_markup"; exit 1 ;;
          esac
          if [[ "$BILLING_SMS_ENABLED" == "true" ]] && \
             [[ "$UOA_SMS_CONFIGURED" != "true" || "$STRIPE_BILLING_ENABLED" != "true" ]]; then
            echo "SMS enablement requires configured SMS evidence credentials/policy and enabled Stripe billing"
            exit 1
          fi

          case "$BILLING_INVOICE_STORAGE_PROVIDER" in
            disabled|gcs) ;;
            *)
              echo "BILLING_INVOICE_STORAGE_PROVIDER must be exactly disabled or gcs"
              exit 1
              ;;
          esac

          if [[ "$BILLING_INVOICE_STORAGE_PROVIDER" == "gcs" && -z "$BILLING_INVOICE_GCS_BUCKET" ]]; then
            echo "BILLING_INVOICE_GCS_BUCKET is required when invoice storage uses gcs"
            exit 1
          fi

          if ! [[ "$STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES" =~ ^[0-9]+$ ]] \
            || (( STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES < 1 || STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES > 60 )); then
            echo "STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES must be an integer from 1 to 60"
            exit 1
          fi

          if [[ "$STRIPE_BILLING_ENABLED" == "true" ]]; then
            if [[ "$UOA_STRIPE_BILLING_CONFIGURED" != "true" ]]; then
              echo "Live Stripe collection requires UOA_STRIPE_BILLING_CONFIGURED=true"
              exit 1
            fi
            for name in LEDGER_BILLING_BASE_URL LEDGER_BILLING_APP_KEY_ID LEDGER_BILLING_ASSERTION_AUDIENCE; do
              if [[ -z "${!name}" ]]; then
                echo "$name is required before Stripe collection can be enabled"
                exit 1
              fi
            done
          fi

      - name: Validate enterprise SSO deployment configuration
        run: |
          case "$UOA_ENTERPRISE_SSO_CONFIGURED" in
            true)
              if ! [[ "$ENTERPRISE_SSO_KMS_KEY" =~ ^projects/[a-zA-Z0-9._-]+/locations/[a-zA-Z0-9_-]+/keyRings/[a-zA-Z0-9_-]+/cryptoKeys/[a-zA-Z0-9_-]+$ ]]; then
                echo "ENTERPRISE_SSO_KMS_KEY must name the configured Cloud KMS wrapping key"
                exit 1
              fi
              ;;
            false)
              if [[ -n "$ENTERPRISE_SSO_KMS_KEY" ]]; then
                echo "A configured enterprise wrapping key requires UOA_ENTERPRISE_SSO_CONFIGURED=true"
                exit 1
              fi
              ;;
            *) echo "UOA_ENTERPRISE_SSO_CONFIGURED must be exactly true or false"; exit 1 ;;
          esac

      - name: Validate directory webhook deployment configuration
        run: |
          case "$UOA_DIRECTORY_WEBHOOKS_CONFIGURED" in
            true|false) ;;
            *) echo "UOA_DIRECTORY_WEBHOOKS_CONFIGURED must be exactly true or false"; exit 1 ;;
          esac

      - name: Deploy to Cloud Run
        id: deploy
        # Secrets MUST come from GCP Secret Manager via --set-secrets, not the
        # GitHub Actions secret store via --set-env-vars. The deploy service
        # account needs roles/secretmanager.secretAccessor on each secret
        # referenced below. Add new secrets here and in Secret Manager as a pair.
        run: |
          env_vars="AUTH_SERVICE_IDENTIFIER=authentication.unlikeotherai.com,PUBLIC_BASE_URL=https://authentication.unlikeotherai.com,EMAIL_PROVIDER=smtp,SMTP_HOST=mail.unlikeotherai.com,SMTP_PORT=465,SMTP_SECURE=true,SMTP_USER=noreply@unlikeotherai.com,EMAIL_FROM=noreply@unlikeotherai.com,EMAIL_REPLY_TO=hello@unlikeotherai.com,ADMIN_AUTH_DOMAIN=authentication.unlikeotherai.com,CONFIG_JWKS_URL=https://authentication.unlikeotherai.com/.well-known/jwks.json,MCP_OAUTH_PUBLIC_PROFILE_ENABLED=true,MCP_OAUTH_DOMAIN=native.authentication.unlikeotherai.com,STRIPE_BILLING_ENABLED=$STRIPE_BILLING_ENABLED,STRIPE_USAGE_EXPORT_INTERVAL_MINUTES=$STRIPE_USAGE_EXPORT_INTERVAL_MINUTES,STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES=$STRIPE_AUTO_TOP_UP_INTERVAL_MINUTES,STRIPE_PRE_BOUNDARY_SAFETY_LEAD_MINUTES=$STRIPE_PRE_BOUNDARY_SAFETY_LEAD_MINUTES,STRIPE_PRE_BOUNDARY_SAFETY_OFFSET_MINUTES=$STRIPE_PRE_BOUNDARY_SAFETY_OFFSET_MINUTES,LEDGER_BILLING_BASE_URL=$LEDGER_BILLING_BASE_URL,LEDGER_BILLING_APP_KEY_ID=$LEDGER_BILLING_APP_KEY_ID,LEDGER_BILLING_ASSERTION_AUDIENCE=$LEDGER_BILLING_ASSERTION_AUDIENCE,BILLING_INVOICE_STORAGE_PROVIDER=$BILLING_INVOICE_STORAGE_PROVIDER"
          if [[ -n "$KELPIE_CONNECT_RESOURCE" ]]; then
            env_vars="$env_vars,KELPIE_CONNECT_RESOURCE=$KELPIE_CONNECT_RESOURCE"
          fi
          if [[ -n "$BILLING_INVOICE_GCS_BUCKET" ]]; then
            env_vars="$env_vars,BILLING_INVOICE_GCS_BUCKET=$BILLING_INVOICE_GCS_BUCKET"
          fi
          if [[ -n "$BILLING_INVOICE_GCS_PROJECT_ID" ]]; then
            env_vars="$env_vars,BILLING_INVOICE_GCS_PROJECT_ID=$BILLING_INVOICE_GCS_PROJECT_ID"
          fi
          secret_vars="DATABASE_URL=uoa-auth-database-url:latest,SHARED_SECRET=uoa-auth-shared-secret:latest,GOOGLE_CLIENT_ID=uoa-auth-google-client-id:latest,GOOGLE_CLIENT_SECRET=uoa-auth-google-client-secret:latest,APPLE_CLIENT_ID=uoa-auth-apple-client-id:latest,APPLE_TEAM_ID=uoa-auth-apple-team-id:latest,APPLE_KEY_ID=uoa-auth-apple-key-id:latest,APPLE_PRIVATE_KEY=uoa-auth-apple-private-key:latest,GITHUB_CLIENT_ID=uoa-auth-github-client-id:latest,GITHUB_CLIENT_SECRET=uoa-auth-github-client-secret:latest,LINKEDIN_CLIENT_ID=uoa-auth-linkedin-client-id:latest,LINKEDIN_CLIENT_SECRET=uoa-auth-linkedin-client-secret:latest,X_CLIENT_ID=uoa-auth-x-client-id:latest,X_CLIENT_SECRET=uoa-auth-x-client-secret:latest,SMTP_PASSWORD=uoa-auth-smtp-password:latest,ADMIN_ACCESS_TOKEN_SECRET=uoa-admin-access-token-secret:latest,ADMIN_CONFIG_JWT=uoa-admin-config-jwt:latest,CONFIG_JWKS_JSON=uoa-auth-config-jwks-json:latest,DATABASE_ADMIN_URL=uoa-auth-database-admin-url:latest,MCP_OAUTH_ACCESS_TOKEN_PRIVATE_JWK=uoa-auth-mcp-oauth-access-token-private-jwk:latest,TARIFF_SNAPSHOT_PRIVATE_JWK=uoa-auth-tariff-snapshot-private-jwk:latest,TARIFF_SNAPSHOT_PUBLIC_JWKS_JSON=uoa-auth-tariff-snapshot-public-jwks-json:latest,UOA_BILLING_ASSERTION_SIGNING_PRIVATE_JWK=uoa-auth-billing-assertion-private-jwk:latest,UOA_BILLING_ASSERTION_PUBLIC_JWKS_JSON=uoa-auth-billing-assertion-public-jwks-json:latest,LEDGER_BILLING_APP_KEY=uoa-auth-ledger-billing-app-key:latest"
          env_vars="$env_vars,BILLING_SMS_ENABLED=$BILLING_SMS_ENABLED,BILLING_SMS_TWILIO_REGION=$BILLING_SMS_TWILIO_REGION,UOA_SMS_PRICING_MODE=$UOA_SMS_PRICING_MODE"
          env_vars="$env_vars,BILLING_SMS_POLICY_AUTORENEW_ENABLED=$BILLING_SMS_POLICY_AUTORENEW_ENABLED,BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS=$BILLING_SMS_POLICY_AUTORENEW_FX_BAND_BPS,BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS=$BILLING_SMS_POLICY_AUTORENEW_LOOKAHEAD_DAYS"
          env_vars="$env_vars,BILLING_CREDIT_FX_RATE_SOURCE=$BILLING_CREDIT_FX_RATE_SOURCE"
          if [[ "$UOA_SMS_CONFIGURED" == "true" ]]; then
            secret_vars="$secret_vars,BILLING_SMS_TWILIO_ACCOUNT_SID=uoa-auth-sms-twilio-account-sid:latest,BILLING_SMS_TWILIO_API_KEY_SID=uoa-auth-sms-twilio-us1-api-key-sid:latest,BILLING_SMS_TWILIO_API_KEY_SECRET=uoa-auth-sms-twilio-us1-api-key-secret:latest,UOA_SMS_COMMERCIAL_POLICY_VERSION=uoa-auth-sms-commercial-policy-version:latest"
            if [[ "$UOA_SMS_PRICING_MODE" == "provider_markup" ]]; then
              secret_vars="$secret_vars,UOA_SMS_PROVIDER_MARKUP_BPS=uoa-auth-sms-provider-markup-bps:latest"
            else
              secret_vars="$secret_vars,UOA_SMS_MONTHLY_FEE_EUR=uoa-auth-sms-monthly-fee-eur:latest,UOA_SMS_MESSAGE_MARKUP_BPS=uoa-auth-sms-message-markup-bps:latest"
            fi
            if [[ "$BILLING_SMS_TWILIO_REGION" == "ie1" ]]; then
              secret_vars="$secret_vars,BILLING_SMS_TWILIO_IE1_API_KEY_SID=uoa-auth-sms-twilio-ie1-api-key-sid:latest,BILLING_SMS_TWILIO_IE1_API_KEY_SECRET=uoa-auth-sms-twilio-ie1-api-key-secret:latest"
            fi
          fi
          scaling_args=(--min-instances 0 --cpu-throttling)
          if [[ "$UOA_ENTERPRISE_SSO_CONFIGURED" == "true" ]]; then
            env_vars="$env_vars,ENTERPRISE_SSO_CUSTODY_PROVIDER=gcp_kms,ENTERPRISE_SSO_KMS_KEY=$ENTERPRISE_SSO_KMS_KEY"
            scaling_args=(--min-instances 1 --no-cpu-throttling)
          fi

          if [[ "$UOA_DIRECTORY_WEBHOOKS_CONFIGURED" == "true" ]]; then
            secret_vars="$secret_vars,DIRECTORY_WEBHOOK_TARGETS_JSON=uoa-auth-directory-webhook-targets-json:latest"
            # The durable outbox dispatcher must run without an incoming request.
            scaling_args=(--min-instances 1 --no-cpu-throttling)
          fi

          if [[ "$UOA_STRIPE_BILLING_CONFIGURED" == "true" ]]; then
            secret_vars="$secret_vars,STRIPE_SECRET_KEY=uoa-auth-stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=uoa-auth-stripe-webhook-secret:latest"
          fi
          if [[ "$STRIPE_BILLING_ENABLED" == "true" ]]; then
            scaling_args=(--min-instances 1 --no-cpu-throttling)
          fi

          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --add-cloudsql-instances "gen-lang-client-0561071620:europe-west1:uoa-auth-db" \
            --max-instances 3 \
            "${scaling_args[@]}" \
            --set-env-vars "$env_vars" \
            --set-secrets "$secret_vars"

          deployed_revision="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)')"
          if [[ -z "$deployed_revision" ]]; then
            echo "Cloud Run did not report the deployed revision"
            exit 1
          fi
          echo "revision=$deployed_revision" >> "$GITHUB_OUTPUT"

      - name: Promote deployed revision
        run: |
          deployed_revision="${{ steps.deploy.outputs.revision }}"
          gcloud run services update-traffic "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$deployed_revision=100"

          ready_revision="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          if [[ "$ready_revision" != "$deployed_revision" ]]; then
            echo "Expected ready revision $deployed_revision, found $ready_revision"
            exit 1
          fi

      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error https://authentication.unlikeotherai.com/health
          curl --fail --silent --show-error https://authentication.unlikeotherai.com/oauth/jwks.json
          curl --fail --silent --show-error https://authentication.unlikeotherai.com/billing/v1/jwks.json
          curl --fail --silent --show-error https://authentication.unlikeotherai.com/billing/v1/service-jwks.json
